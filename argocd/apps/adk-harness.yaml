apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: adk
  namespace: kagent
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  kagent: {}
  workload:
    # atelet treats localhost registry references as plain HTTP and rewrites
    # them to the in-cluster registry endpoint before pulling the image.
    # Publishing regenerates this digest from main-1eb89fb.
    image: localhost:5000/kagent-dev/kagent/golang-adk:main-1eb89fb@sha256:5dd9ce986070a8f3a91180596e6d0866027c4e86c526ec74afd95d00f9dc66af
    command: ["/app"]
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/main-1eb89fb-local/adk
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: hello-substrate-default
  namespace: kagent
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  description: Friendly agent running inside a Substrate sandbox.
  modelConfig:
    name: default-model-config
  systemPrompt: Say that you are hello-substrate, a Go ADK agent running inside a gVisor actor.
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: adk
  namespace: kagent
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  template:
    ref:
      name: hello-substrate-default
  harnessRef:
    name: adk
