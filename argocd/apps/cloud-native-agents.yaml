apiVersion: kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: observability-agent
  namespace: kagent
  labels:
    kagent.dev/runtime: hello-substrate
spec:
  description: Investigates Prometheus, Grafana, Loki, and Kubernetes telemetry.
  modelConfig:
    name: default-model-config
  systemPrompt: |
    You are the Observability Agent.

    Investigate metrics, logs, dashboards, targets, labels, alerts, and
    telemetry health using the attached read-only tools. State the exact
    PromQL or LogQL, datasource, time range, filters, and whether each result
    is observed or inferred. Keep queries narrow and ask for missing context.
    Do not mutate dashboards, alerts, datasources, workloads, or cluster
    resources.
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: kagent-grafana-mcp
        tools:
          - kagent-grafana_check_datasources_health
          - kagent-grafana_list_prometheus_metric_names
          - kagent-grafana_list_prometheus_metric_metadata
          - kagent-grafana_list_prometheus_label_names
          - kagent-grafana_list_prometheus_label_values
          - kagent-grafana_query_prometheus
          - kagent-grafana_query_prometheus_histogram
          - kagent-grafana_list_loki_label_names
          - kagent-grafana_list_loki_label_values
          - kagent-grafana_query_loki_logs
          - kagent-grafana_query_loki_patterns
          - kagent-grafana_query_loki_stats
          - kagent-grafana_search_dashboards
          - kagent-grafana_get_dashboard_summary
          - kagent-grafana_get_dashboard_panel_queries
          - kagent-grafana_find_slow_requests
          - kagent-grafana_find_error_pattern_logs
    - mcp:
        server:
          kind: RemoteMCPServer
          name: kagent-tool-server
        tools:
          - prometheus_label_names_tool
          - prometheus_promql_tool
          - prometheus_query_range_tool
          - prometheus_query_tool
          - prometheus_targets_tool
          - k8s_get_resources
          - k8s_get_events
          - k8s_get_pod_logs
---
apiVersion: kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: promql-agent
  namespace: kagent
  labels:
    kagent.dev/runtime: hello-substrate
spec:
  description: Generates, validates, and explains PromQL queries from natural language.
  modelConfig:
    name: default-model-config
  systemPrompt: |
    You are the PromQL Agent.

    Translate natural-language monitoring questions into precise PromQL. First
    discover metric names and labels when needed, then validate and execute the
    smallest useful query. Always show the final PromQL, time range, filters,
    aggregation, and limitations. Never fabricate metric names or values.
    This agent is strictly read-only.
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: kagent-tool-server
        tools:
          - prometheus_label_names_tool
          - prometheus_promql_tool
          - prometheus_query_range_tool
          - prometheus_query_tool
          - prometheus_targets_tool
          - k8s_get_resources
    - mcp:
        server:
          kind: RemoteMCPServer
          name: kagent-grafana-mcp
        tools:
          - kagent-grafana_list_prometheus_metric_names
          - kagent-grafana_list_prometheus_metric_metadata
          - kagent-grafana_list_prometheus_label_names
          - kagent-grafana_list_prometheus_label_values
          - kagent-grafana_query_prometheus
          - kagent-grafana_query_prometheus_histogram
