apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: grafana, namespace: argocd}
spec:
  project: default
  source: {repoURL: http://gitea-http.gitea.svc.cluster.local:3000/admin/ai-dlc.git, targetRevision: main, path: platform/grafana}
  destination: {server: https://kubernetes.default.svc, namespace: grafana}
  syncPolicy:
    automated: {selfHeal: true, prune: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true, ApplyOutOfSyncOnly=true]
