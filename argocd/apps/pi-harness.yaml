apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: pi
  namespace: kagent
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  byo: {}
  workload:
    # New snapshot location avoids restoring actors created by an older Pi CLI.
    image: localhost:5000/ai-dlc/pi-harness:pi-1.3.0@sha256:1217102c798b07f7e9d21f21fa44567f48141266de99c76c4cce9ccebfd99cda
    command: ["/usr/local/bin/pi-harness"]
  env:
    - name: PORT
      value: "80"
    - name: PI_SESSION_DIR
      value: /data/pi-sessions
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/pi-harness-v1.3.0-kagent-main-1eb89fb-rpcfix1
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: pi-default
  namespace: kagent
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  description: Pi coding agent through the AgentGateway.
  modelConfig:
    name: default-model-config
  systemPrompt: You are a helpful Pi coding agent.
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: pi
  namespace: kagent
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  template:
    ref:
      name: pi-default
  harnessRef:
    name: pi
