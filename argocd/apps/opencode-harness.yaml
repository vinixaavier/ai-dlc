apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: opencode
  namespace: kagent
spec:
  byo: {}
  workload:
    image: localhost:5000/ai-dlc/opencode-harness:opencode-1.19.2@sha256:758846e84dc5de9c724b04b875e7f799ad84bd42353b9971263cbbc58628dd11
    command: ["/usr/local/bin/opencode-harness"]
  env:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://otel-collector.otel.svc.cluster.local:4317
    - name: OTEL_SERVICE_NAME
      value: opencode
    - name: PORT
      value: "80"
    - name: OPENCODE_VERSION
      value: 1.19.2
    # AgentGateway's local SGLang route accepts a dummy bearer key.
    - name: OPENAI_API_KEY
      value: sglang-local
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/opencode-harness-v1.19.2
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: opencode-default
  namespace: kagent
  labels:
    kagent.dev/runtime: opencode
spec:
  description: OpenCode coding agent through the AgentGateway.
  modelConfig:
    name: default-model-config
  systemPrompt: You are a helpful OpenCode coding agent.
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: opencode
  namespace: kagent
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  template:
    ref:
      name: opencode-default
  harnessRef:
    name: opencode
