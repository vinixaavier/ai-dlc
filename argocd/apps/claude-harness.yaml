apiVersion: v1
kind: Secret
metadata:
  name: kagent-sglang
  namespace: kagent
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  # AgentGateway's local SGLang route accepts passthrough headers without validating this value.
  API_KEY: sglang-local
---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: claude-agentgateway
  namespace: kagent
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider: Anthropic
  apiKeySecret: kagent-sglang
  apiKeySecretKey: API_KEY
  # Claude Code requires the Anthropic provider; AgentGateway maps sonnet to Qwen.
  model: sonnet
  anthropic:
    # The Anthropic SDK appends /v1/messages to this API root.
    baseUrl: http://agentgateway-api.agentgateway-system.svc.cluster.local
---
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: claude
  namespace: kagent
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  claude: {}
  workload:
    image: localhost:5000/kagent-dev/kagent/claude-harness:main-1eb89fb-claude-2.1.301@sha256:6303742f6e0a6d87a623c148c8acc783b18801211657310c88d980361d89f89b
  env:
    - name: CLAUDE_CODE_EFFORT_LEVEL
      value: medium
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/claude-harness-v2.1.301
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: claude-default
  namespace: kagent
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  description: Claude Code agent through the AgentGateway.
  modelConfig:
    name: claude-agentgateway
  systemPrompt: You are a helpful Claude coding agent.
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: claude
  namespace: kagent
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  template:
    ref:
      name: claude-default
  harnessRef:
    name: claude
