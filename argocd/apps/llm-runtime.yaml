apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llm-runtime
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/admin/ai-dlc.git
    targetRevision: main
    path: platform/llm-runtime
  destination:
    server: https://kubernetes.default.svc
    namespace: sglang
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
