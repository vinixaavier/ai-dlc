apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://dl.gitea.com/charts
    chart: gitea
    targetRevision: 12.7.0
    helm:
      valuesObject:
        fullnameOverride: gitea
        admin:
          username: admin
          password: ai-dlc-local-admin
          email: admin@ai-dlc.local
          passwordMode: keepUpdated
        persistence:
          enabled: true
          create: true
          claimName: gitea-shared-storage
          size: 10Gi
          accessModes:
            - ReadWriteOnce
        service:
          http:
            type: NodePort
            port: 3000
            nodePort: 30090
          ssh:
            type: NodePort
            port: 22
            nodePort: 30022
        postgresql:
          enabled: true
        postgresql-ha:
          enabled: false
        valkey:
          enabled: false
        valkey-cluster:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: gitea-postgresql
      namespace: gitea
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
