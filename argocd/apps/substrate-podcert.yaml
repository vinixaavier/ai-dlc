apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: substrate-podcert
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/kagent-dev/substrate/helm
      chart: substrate-podcert
      targetRevision: 0.5.0-alpha2
      helm:
        releaseName: substrate-podcert
        valueFiles:
          - $values/platform/substrate/podcert-values.yaml
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/admin/ai-dlc.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: podcertificate-controller-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
