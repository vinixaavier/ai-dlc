# AgentRegistry artifacts are persisted through its /v0/apply API rather than
# Kubernetes CRDs. Apply this stream after installing AgentRegistry:
# curl --data-binary @platform/agentregistry/kagent-catalog.yaml \
#   -H 'Content-Type: application/yaml' http://agentregistry.localhost/v0/apply
#
# These entries describe the running kagent A2A agents; deployment ownership
# remains with the kagent Helm release.
apiVersion: ar.dev/v1alpha1
kind: Agent
metadata:
  name: argo-rollouts-conversion-agent
spec:
  title: Argo Rollouts Conversion Agent
  description: "A2A agent exposed at aigw.localhost/argo-rollouts-conversion-agent; converts Deployments to Argo Rollouts."
  source: {image: registry.registry.svc.cluster.local:5000/kagent-dev/kagent/golang-adk:0.10.1-otel, protocol: A2A}
---
