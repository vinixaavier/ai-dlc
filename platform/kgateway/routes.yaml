apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent
  namespace: kagent
spec:
  parentRefs:
    - name: localhost
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: kgateway-system
      sectionName: http
  hostnames: [kagent.localhost]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: kagent-ui
          port: 8080
          weight: 1
      # A2A/gRPC-Web responses are long-lived streams. Without an explicit
      # timeout Envoy's route default is 15s, which closes the response before
      # the gRPC-Web trailers arrive and surfaces as ERR_INCOMPLETE_CHUNKED_ENCODING.
      timeouts:
        request: 30m
        backendRequest: 30m
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: a2a-kagent
  namespace: kagent
spec:
  parentRefs:
    - name: localhost
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: kgateway-system
      sectionName: http
  hostnames: [a2a-kagent.localhost]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: kagent-controller
          port: 8083
          weight: 1
      # A2A runs over gRPC / gRPC-Web: long-lived streams. Without an explicit
      # timeout Envoy's route default is 15s, which closes the response before
      # the gRPC-Web trailers arrive (same issue the kagent UI route documents).
      timeouts:
        request: 30m
        backendRequest: 30m
---
