apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: grafana
spec:
  parentRefs:
    - name: localhost
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: kgateway-system
      sectionName: http
  # Browser-friendly hostname plus the WSL-safe host used by Go CLIs such as
  # gcx (which does not resolve *.localhost through the Windows resolver).
  hostnames: [grafana.localhost]
  rules:
    # `localhost` is reserved for WSL CLI access (gcx). Scope that alias to
    # Grafana's APIs so it cannot capture AgentGateway's /v1, /mcp or A2A
    # routes on the same host. grafana.localhost remains the browser UI URL.
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - group: ""
          kind: Service
          name: grafana
          port: 3000
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /apis
      backendRefs:
        - group: ""
          kind: Service
          name: grafana
          port: 3000
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: grafana
          port: 3000
          weight: 1
---
