apiVersion: v2
name: kagent
description: A Helm chart for kagent, built with Google ADK
type: application
version: 0.0.0-main.1eb89fb
annotations:
  "org.opencontainers.image.source": "https://github.com/kagent-dev/kagent"
  "org.opencontainers.image.revision": "1eb89fb1b670571e25d17e9f55551c567a28f500"
dependencies:
  - name: kmcp
    version: 0.0.0-main.8f26f04
    repository: file://charts/kmcp
    condition: kmcp.enabled
  - name: kagent-tools
    version: 0.0.0-main.7d3fde6d
    repository: file://charts/kagent-tools
    condition: kagent-tools.enabled
  - name: grafana-mcp
    version: 0.0.0-main.1eb89fb
    repository: file://charts/grafana-mcp
    condition: grafana-mcp.enabled
  - name: oauth2-proxy
    version: 10.7.0
    repository: file://charts/oauth2-proxy
    condition: oauth2-proxy.enabled
