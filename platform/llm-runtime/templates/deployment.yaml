apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.service.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.service.name }}
    app.kubernetes.io/component: llm-runtime
    ai-dlc/runtime: {{ .Values.runtime | quote }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.service.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.service.name }}
        app.kubernetes.io/component: llm-runtime
        ai-dlc/runtime: {{ .Values.runtime | quote }}
    spec:
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      runtimeClassName: nvidia
      containers:
        - name: {{ .Values.runtime }}
          image: {{ if eq .Values.runtime "vllm" }}{{ .Values.images.vllm }}{{ else }}{{ .Values.images.sglang }}{{ end }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command:
            - {{ if eq .Values.runtime "vllm" }}vllm{{ else }}sglang{{ end }}
            - serve
          args:
            {{- if eq .Values.runtime "vllm" }}
            - {{ .Values.model | quote }}
            - --served-model-name={{ .Values.servedModelName }}
            {{- else }}
            - --model-path={{ .Values.model }}
            - --served-model-name={{ .Values.servedModelName }}
            - --host=0.0.0.0
            - --port={{ .Values.service.port }}
            - --otlp-traces-endpoint={{ .Values.otelTracesEndpoint }}
            {{- end }}
{{- if eq .Values.runtime "vllm" }}
{{ toYaml .Values.vllmArgs | indent 12 }}
{{- else }}
{{ toYaml .Values.sglangArgs | indent 12 }}
{{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          env:
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: HF_HOME
              value: /root/.cache/huggingface
            {{- if eq .Values.runtime "sglang" }}
            # Keep the OTel trace verbosity low;
            # avoids per-step prefill/decode spans flooding the collector.
            - name: SGLANG_TRACE_LEVEL
              value: "2"
            # The default /health implementation performs a 1-token inference,
            # which is unnecessary for this Kubernetes readiness probe and is
            # exported as a HEALTH_CHECK trace.
            - name: SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION
              value: "false"
            {{- end }}
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
      volumes:
        - name: model-cache
          hostPath:
            path: {{ .Values.cacheHostPath }}
            type: DirectoryOrCreate
