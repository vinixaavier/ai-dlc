      - args:
        - -f
        - /etc/agentgateway/config.yaml
        env:
        - name: RUST_LOG
          value: debug
        image: registry.registry.svc.cluster.local:5000/kagent-dev/substrate/agentgateway:v0.0.0-alpha.168b05d6@sha256:516026ea5bdc503ac011449cb95a5240f510cdc55a3983bbececa52c1f3429eb
        name: agentgateway
        ports:
        - containerPort: 8443
          name: https
        - containerPort: 15021
          name: readiness
        - containerPort: 15020
          name: stats
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: readiness
          periodSeconds: 10
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /healthz/ready
            port: readiness
          periodSeconds: 1
        volumeMounts:
        - mountPath: /etc/agentgateway
          name: config
          readOnly: true
        - mountPath: /run/servicedns.podcert.ate.dev
          name: servicedns
          readOnly: true
        - mountPath: /run/actor-id-ca-certs
          name: actor-id-ca-certs
          readOnly: true
        - mountPath: /run/podidentity.podcert.ate.dev
          name: podidentity
          readOnly: true
        - mountPath: /run/servicedns-ca
          name: servicedns-ca
          readOnly: true
        - mountPath: /run/egress-mitm
          name: egress-mitm
          readOnly: true
      securityContext:
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      serviceAccountName: atenet-egress
      terminationGracePeriodSeconds: 60
      volumes:
      - configMap:
          name: atenet-egress-agentgateway-substrate-config
        name: config
      - emptyDir: {}
        name: drain-signal
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: servicedns.podcert.ate.dev/identity
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: servicedns.podcert.ate.dev/identity
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: podidentity.podcert.ate.dev/identity
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: podidentity.podcert.ate.dev/identity
      - name: actor-id-ca-certs
        secret:
          secretName: actor-id-ca-certs
      - name: servicedns-ca
        projected:
          sources:
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: servicedns.podcert.ate.dev/identity
      - name: egress-mitm
        secret:
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
          secretName: egress-mitm-ca-pool
