apiVersion: v1
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.otel.svc.cluster.local:4317
  OTEL_LOGS_EXPORTER: otlp,console
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  OTEL_METRIC_EXPORT_TIMEOUT: "10000"
kind: ConfigMap
metadata:
  name: ate-otel-config
  namespace: ate-system
---
apiVersion: v1
data:
  config.yaml: |-
    frontendPolicies:
      accessLog:
        add:
          substrate.connect.authority: source.connectHeaders["host"]
      substrateEgressActorResolution:
        host: api.ate-system.svc:443
        policies:
          backendTLS:
            cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
            key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
            root: /run/servicedns-ca/trust-bundle.pem

    binds:
    - port: 8443
      tunnelProtocol: connect
      listeners:
      - protocol: HTTPS
        tls:
          cert: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          key: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          root: /run/actor-id-ca-certs/ca.crt
        routes: []
    - mode: internal
      protocol: AUTO
      listeners:
      - protocol: HTTPS
        tls:
          mode: dynamicCa
          cert: /run/egress-mitm/tls.crt
          key: /run/egress-mitm/tls.key
        routes:
        - backends:
          - dynamic: {}
            policies:
              backendTLS: {}
          policies:
            substrateEgress: &egressPolicy
              credentialProviders:
              - uriAuthority: "k8s.io"
                target:
                  host: "k8s-credential-provider.ate-system.svc:50051"
                  policies:
                    backendTLS:
                      hostname: "k8s-credential-provider.ate-system.svc"
                      cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                      key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                      root: /run/servicedns-ca/trust-bundle.pem
              host: api.ate-system.svc:443
              policies:
                backendTLS:
                  cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                  key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                  root: /run/servicedns-ca/trust-bundle.pem
      - protocol: HTTP
        routes:
        - backends:
          - dynamic:
              target: source.connectHeaders["host"]
          policies:
            substrateEgress: *egressPolicy
      - protocol: TLS
        tcpRoutes:
        - backends:
          - dynamic: {}
kind: ConfigMap
metadata:
  name: atenet-egress-agentgateway-substrate-config
  namespace: ate-system
---
apiVersion: v1
data:
  config.yaml: |
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    config:
      statsAddr: 0.0.0.0:15020

    frontendPolicies:
      tracing:
        host: $AGENTGATEWAY_OTLP_ADDRESS
        protocol: grpc
        # Keep in sync with the router's dataPlaneTraceRatio.
        randomSampling: 0.01

    gateways:
      http:
        port: 8080
        protocol: HTTP
      https:
        port: 8443
        protocol: HTTPS
        tls:
          cert: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          key: /run/servicedns.podcert.ate.dev/credential-bundle.pem

    backends:
    - name: dynamic
      dynamic: {}
      policies:
        # Actors use HTTP/1.1 unless the request is gRPC.
        http:
          version: HTTP/1.1
        # All actor traffic reaches atunnel over mTLS CONNECT.
        backendTunnel:
          proxy:
            backend: /dynamic
          mode: connect
          policies:
            backendTLS:
              cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
              key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
              root: /run/podidentity.podcert.ate.dev/trust-bundle.pem
              insecureHost: true

    routes:
    - name: substrate-actors
      gateways:
      - http
      - https
      matches:
      - path:
          pathPrefix: /
      policies: &substrate-ingress
        substrateIngress:
          host: api.ate-system.svc:443
          # AgentGateway only uses atunnel's CONNECT listener.
          connectTargetPort: 8443
          policies:
            backendTLS:
              cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
              key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
              root: /run/servicedns-ca/trust-bundle.pem
      backends:
      - backend: /dynamic
    - name: substrate-actors-grpc
      gateways:
      - http
      - https
      matches: &grpc-matches
      - method: POST
        headers:
        - name: content-type
          value:
            regex: '(?i)^application/grpc([+;].*)?$'
      policies: *substrate-ingress
      backends: &grpc-backends
      - backend: /dynamic
        policies:
          http:
            version: HTTP/2.0

    # Terminate client CONNECT before internal HTTP routing.
    binds:
    - port: 8081
      tunnelProtocol: connect
      listeners:
      - protocol: HTTP
        routes: []
    - port: 8444
      tunnelProtocol: connect
      listeners:
      - protocol: HTTPS
        tls:
          cert: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          key: /run/servicedns.podcert.ate.dev/credential-bundle.pem
        routes: []
    - mode: internal
      listeners:
      - protocol: HTTP
        routes:
        - name: substrate-actors-tunneled
          matches:
          - path:
              pathPrefix: /
          policies: *substrate-ingress
          backends:
          - backend: /dynamic
        - name: substrate-actors-tunneled-grpc
          matches: *grpc-matches
          policies: *substrate-ingress
          backends: *grpc-backends
kind: ConfigMap
metadata:
  name: atenet-router-agentgateway-config
  namespace: ate-system
