apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: ate-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
      - env:
        - name: RUSTFS_ADDRESS
          value: :9000
        - name: RUSTFS_CONSOLE_ADDRESS
