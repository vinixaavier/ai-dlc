apiVersion: v1
kind: Secret
metadata:
  name: substrate-postgres-readwrite
  namespace: ate-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  readWriteConnectionString: >-
    postgresql://substrate_readwrite_user@postgres.ate-system.svc:5432/atepg?sslmode=verify-full&sslrootcert=/run/servicedns.podcert.ate.dev/trust-bundle.pem&sslcert=/run/postgres.podcert.ate.dev/substrate_readwrite_user.pem&sslkey=/run/postgres.podcert.ate.dev/substrate_readwrite_user.pem
---
apiVersion: v1
kind: Secret
metadata:
  name: substrate-postgres-owner
  namespace: ate-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  ownerConnectionString: >-
    postgresql://substrate_owner_user@postgres.ate-system.svc:5432/atepg?sslmode=verify-full&sslrootcert=/run/servicedns.podcert.ate.dev/trust-bundle.pem&sslcert=/run/postgres.podcert.ate.dev/substrate_owner_user.pem&sslkey=/run/postgres.podcert.ate.dev/substrate_owner_user.pem
