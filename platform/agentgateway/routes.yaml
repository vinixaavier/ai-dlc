apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: sglang
  namespace: agentgateway-system
spec:
  ai:
    provider:
      custom:
        # SGLang exposes only the OpenAI Chat Completions wire format.
        # AgentGateway translates public Anthropic Messages requests into it.
        formats:
          - type: Completions
      host: llm.sglang.svc.cluster.local
      port: 8000
      path: /v1/chat/completions
  policies:
    auth:
      passthrough: {}
    ai:
      # Claude Code must use a Claude-shaped model name locally, while the
      # OpenAI-compatible SGLang server only serves the Qwen model.
      modelAliases:
        sonnet: qwen3.8-27b-nvfp4
        claude-sonnet-5: qwen3.8-27b-nvfp4
      routes:
        "/v1/chat/completions": Completions
        "/v1/responses": Responses
        "/v1/messages": Messages
        "/v1/messages/count_tokens": AnthropicTokenCount
---
# Virtual MCP (multiplexing): one federated backend that serves every kagent
# MCP server through the single /mcp route.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: kagent-mcp-federated
  namespace: kagent
spec:
  mcp:
    failureMode: FailOpen
    targets:
      - name: kagent-tools
        static:
          host: kagent-tools.kagent.svc.cluster.local
          port: 8084
          protocol: StreamableHTTP
          path: /mcp
      - name: kagent-grafana
        static:
          host: kagent-grafana-mcp.kagent.svc.cluster.local
          port: 8000
          protocol: StreamableHTTP
          path: /mcp
      - name: kagent-actor
        static:
          host: kagent-controller.kagent.svc.cluster.local
          port: 8083
          protocol: StreamableHTTP
          path: /mcp
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent-mcp
  namespace: kagent
spec:
  parentRefs:
    - name: agentgateway-api
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: agentgateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: kagent-mcp-federated
          weight: 1
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: sglang-models
  namespace: agentgateway-system
spec:
  static:
    host: llm.sglang.svc.cluster.local
    port: 8000

---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: otel-collector
  namespace: agentgateway-system
spec:
  static:
    host: otel-collector.otel.svc.cluster.local
    port: 4317
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: otel-collector-http
  namespace: agentgateway-system
spec:
  static:
    host: otel-collector.otel.svc.cluster.local
    port: 4318
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: qwen3.8-27b-nvfp4
  namespace: agentgateway-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-api
      sectionName: http
  match:
    model: qwen3.8-27b-nvfp4
  provider: OpenAI
  baseURL: http://llm.sglang.svc.cluster.local:8000/v1
  policies:
    auth:
      passthrough: {}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sglang
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: agentgateway-api
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/chat/completions
        - path:
            type: Exact
            value: /v1/messages
        - path:
            type: Exact
            value: /v1/messages/count_tokens
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: sglang
    - matches:
        - path:
            type: Exact
            value: /v1/responses
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          # Static routing preserves SGLang's native Responses payload.
          name: sglang-models
    - matches:
        - path:
            type: PathPrefix
            value: /opentelemetry.proto.collector.trace.v1.TraceService/
        - path:
            type: PathPrefix
            value: /opentelemetry.proto.collector.metrics.v1.MetricsService/
        - path:
            type: PathPrefix
            value: /opentelemetry.proto.collector.logs.v1.LogsService/
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: otel-collector
    - matches:
        - path:
            type: Exact
            value: /v1/traces
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: otel-collector-http
